[tools]
go = "1.26.5"
golangci-lint = "2.13.2"
lefthook = "2.1.12"

[env]
# Local development settings; see .env.example for the full set.
_.file = ".env"

[tasks.format]
description = "Format the Go codebase"
dir = "{{config_root}}/backend"
run = "golangci-lint fmt ./..."

[tasks."fmt:check"]
description = "Fail if the Go codebase is not formatted"
dir = "{{config_root}}/backend"
run = "golangci-lint fmt --diff ./..."

[tasks.lint]
description = "Lint the Go codebase"
dir = "{{config_root}}/backend"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run the Go tests"
dir = "{{config_root}}/backend"
run = "go test ./..."

[tasks.start]
description = "Run the backend"
dir = "{{config_root}}/backend"
run = "go run ./cmd/app"

[tasks.hooks]
description = "Install the lefthook git hooks"
run = "lefthook install"

[tasks."openapi:gen"]
description = "Regenerate the Go API from api/openapi.yaml"
dir = "{{config_root}}/backend"
run = "go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml"

[tasks.autocommit]
description = "Review a Claude-written commit message in the editor, then commit"
dir = "{{config_root}}"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

if git diff --cached --quiet; then
  echo "autocommit: nothing staged" >&2
  exit 1
fi

prompt="Write a git commit message for the staged diff on stdin.
Conventional Commits: type(optional scope): subject, imperative mood, at most 72 characters.
Add a body only if the diff is large. The body should list the changes, generalized into bullet points.
Output the message and nothing else: no code fences, no commentary."

staged=$(mktemp)
draft=$(mktemp)
trap 'rm -f "$staged" "$draft"' EXIT

{ git diff --cached --stat; git diff --cached; } | head -c 200000 > "$staged"

if ! message=$(claude -p --model sonnet --output-format text "$prompt" < "$staged"); then
  echo "autocommit: claude failed: $message" >&2
  exit 1
fi

if [ -z "$(printf %s "$message" | tr -d '[:space:]')" ]; then
  echo "autocommit: claude returned an empty message" >&2
  exit 1
fi

if [ -n "${AUTOCOMMIT_DRY_RUN:-}" ]; then
  printf '%s\n' "$message"
  echo "autocommit: dry run, editor not opened"
  exit 0
fi

printf '%s\n' "$message" > "$draft"

# Opens the draft in the editor; saving commits, emptying it aborts.
GIT_EDITOR="${GIT_EDITOR:-${EDITOR:-vim}}" git commit --edit --file "$draft"
'''
