[package]
name = "mealprep-rs"
version = "0.1.0"
description = "Plan a week of meals against daily macro targets"
authors = ["mertan"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the library name apart from the binary's, which otherwise
# collide on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "mealprep_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The acceptance release environment: compiles the demo database into the binary, seeds it
# on first launch and exposes the command that puts it back. A production build must never
# enable it — see docs/release.md.
acceptance = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mealprep-anthropic.workspace = true
mealprep-core.workspace = true
mealprep-openfoodfacts.workspace = true
mealprep-sqlite.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true
uuid.workspace = true

# The scanner drives the camera through ML Kit on Android; there is none on desktop.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner.workspace = true

[lints]
workspace = true
