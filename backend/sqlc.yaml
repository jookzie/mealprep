version: "2"
sql:
  - engine: sqlite
    schema: sqlc/sqlite/schema.sql
    queries: sqlc/sqlite/queries
    gen:
      go:
        package: db
        out: internal/repository/sqlite/db
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
